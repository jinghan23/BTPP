<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>书籍列表 - TransPub</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>我的书籍收藏</h1>
            <p class="subtitle" id="subtitle">加载中…</p>
        </header>

        <div class="books-grid" id="books-list">
        </div>

        <footer>
            <p>Powered by <a href="https://github.com/jinghan23/TransPub" target="_blank">TransPub</a></p>
        </footer>
    </div>

    <script>
        async function loadBooks() {
            try {
                const response = await fetch('books.json');
                const books = await response.json();
                const container = document.getElementById('books-list');
                document.getElementById('subtitle').textContent =
                    `由 TransPub 生成 | 共 ${books.length} 本书籍`;

                books.forEach(book => {
                    const card = document.createElement('div');
                    card.className = 'book-card';
                    card.style.cursor = 'pointer';
                    card.onclick = () => location.href = `books/${book.id}/index.html`;

                    card.innerHTML = `
                        <div class="book-title">${book.title}</div>
                        <div class="book-meta">
                            <span>📚 ${book.chapters} 章节</span>
                            <span>🌐 ${book.language}</span>
                            <span>${book.status}</span>
                        </div>
                    `;

                    container.appendChild(card);
                });
            } catch (error) {
                console.error('加载书籍列表失败:', error);
                document.getElementById('books-list').innerHTML =
                    '<p>加载失败，请稍后再试。</p>';
            }
        }

        loadBooks();
    </script>
</body>
</html>
